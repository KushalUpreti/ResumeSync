[project]
name = "resumesync-server"
version = "0.1.0"
description = "Backend API and worker scaffold for ResumeSync AI."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42,<2.0",
    "fastapi>=0.115,<1.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "litellm>=1.0,<2.0",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<6.0",
    "docxtpl>=0.16,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
